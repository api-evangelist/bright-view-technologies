name: Bright View Technologies
description: >-
  BrightView Technologies, Inc. is a Durham, North Carolina optical film company
  specializing in computational optics and the design and manufacture of Micro Lens
  Array (MLA) solutions that shape, diffuse, and manage light. Founded in 2002 on
  intellectual property licensed from Duke University, the company engineers precision
  optical films and micro-optical structures used in automotive displays, head-up
  displays, and LiDAR; consumer and mini/micro-LED displays (gain enhancement and
  LED-hiding films); LED and architectural lighting (beam shaping and diffusion); and
  augmented- and virtual-reality beam-shaping optics. BrightView is a hardware and
  materials manufacturer serving OEMs and does not publish a public developer API,
  SDK, or developer portal. This profile was added to the API Evangelist network as a
  portfolio-company lead of Battery Ventures and enriched from the company's public
  website.
